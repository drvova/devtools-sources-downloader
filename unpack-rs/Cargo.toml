[package]
name = "devtools-unpack"
version = "0.1.0"
edition = "2021"
description = "Rust port of the DevTools sources-downloader unpack engine (the former JavaScript engine and its pure-transform modules)"
license = "MIT"

[dependencies]
base64 = "0.22"
brotli = "7"
flate2 = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order keeps JSON object keys in insertion order, so serialized
# reports match the JavaScript output byte for byte instead of being
# alphabetically reordered.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
url = "2"

[lib]
name = "devtools_unpack"
path = "src/lib.rs"
# cdylib builds the browser engine (wasm32); rlib keeps cargo test working.
crate-type = ["rlib", "cdylib"]

[profile.release]
# wasm engine build: size over speed (decompressors dominate either way)
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
