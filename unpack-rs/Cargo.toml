[package]
name = "devtools-unpack"
version = "0.1.0"
edition = "2021"
description = "Rust port of the DevTools sources-downloader unpack engine (src/js/unpack.js and its pure-transform modules)"
license = "MIT"

[dependencies]
base64 = "0.22"
brotli = "7"
flate2 = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"

[lib]
name = "devtools_unpack"
path = "src/lib.rs"
