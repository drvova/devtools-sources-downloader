<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="devtools-unpack: a Chrome DevTools extension with a Rust engine compiled to WebAssembly. It captures everything a page loads and runs, then peels every obfuscation layer.">
  <title>devtools-unpack</title>
  <desc>Capture everything a page loads and runs, then peel every layer.</desc>

  <defs>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#ffb454" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb454" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#ffb454" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ffb454" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2027"/>
      <stop offset="1" stop-color="#12161b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="320" rx="0"/></clipPath>
  </defs>

  <style>
    .kicker { font: 600 13px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 3.4px; fill: #ffb454; }
    .word   { font: 700 56px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; letter-spacing: -1.6px; fill: #f4f6f8; }
    .sub    { font: 400 18px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #8b949e; }
    .tag    { font: 600 12px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 1.6px; fill: #c9d1d9; }
    .idx    { font: 600 11px ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; fill: #ffb454; }

    /* Each layer holds, peels away, waits, and comes back, so the loop closes
       without a snap. The delays stagger the four, which reads as a rolling peel
       that rebuilds itself rather than a stack that resets all at once. */
    .peel { animation: peel 7.2s cubic-bezier(.22,.68,.32,1) infinite; transform-origin: center; }
    .p1 { animation-delay: 0s; }
    .p2 { animation-delay: .5s; }
    .p3 { animation-delay: 1s; }
    .p4 { animation-delay: 1.5s; }
    @keyframes peel {
      0%, 16%   { opacity: 1; transform: translate(0, 0) rotate(0deg); }
      30%       { opacity: 0; transform: translate(46px, -34px) rotate(7deg); }
      74%       { opacity: 0; transform: translate(46px, -34px) rotate(7deg); }
      90%, 100% { opacity: 1; transform: translate(0, 0) rotate(0deg); }
    }
    /* the source layer is what is left, so it breathes on its own clock rather
       than trying to stay in step with four staggered peels */
    .source { animation: reveal 3.6s ease-in-out infinite; }
    @keyframes reveal {
      0%, 100% { opacity: .55; }
      50%      { opacity: 1; }
    }
    .sourcebar { animation: reveal 3.6s ease-in-out infinite; }
    /* a single pass of light across the wordmark, once per cycle */
    .sweep { animation: sweep 7.2s linear infinite; }
    @keyframes sweep {
      0%, 46%   { transform: translateX(-260px); opacity: 0; }
      50%       { opacity: .5; }
      62%       { transform: translateX(760px); opacity: 0; }
      100%      { transform: translateX(760px); opacity: 0; }
    }
    .caret { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .peel, .source, .sourcebar, .sweep, .caret { animation: none; }
      .p1, .p2, .p3, .p4 { opacity: .55; }
      .source, .sourcebar { opacity: 1; }
    }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="320" fill="#0b0d10"/>
    <rect width="1280" height="320" fill="url(#grid)"/>
    <rect width="1280" height="320" fill="url(#glow)"/>

    <!-- a hairline along the top edge, so the banner has an edge rather than floating -->
    <rect width="1280" height="1" fill="#ffb454" fill-opacity="0.35"/>

    <!-- left: identity -->
    <text class="kicker" x="72" y="112">CHROME DEVTOOLS EXTENSION · RUST → WASM</text>

    <text class="word" x="72" y="176">devtools-unpack</text>
    <rect class="sweep" x="72" y="132" width="120" height="56" fill="#ffb454" fill-opacity="0.18"/>

    <text class="sub" x="72" y="216">capture everything a page loads and runs,</text>
    <text class="sub" x="72" y="242">then peel every layer off it.<tspan class="caret" fill="#ffb454">_</tspan></text>

    <rect x="72" y="272" width="420" height="1" fill="url(#rule)"/>

    <!-- right: the peel, which is the whole idea -->
    <g transform="translate(760 0)">
      <!-- four layers that leave -->
      <g class="peel p1">
        <rect x="0" y="66" width="330" height="38" rx="6" fill="url(#layer)" stroke="#2a323c"/>
        <rect x="0" y="66" width="4" height="38" rx="2" fill="#ffb454" fill-opacity=".55"/>
        <text class="idx" x="18" y="90">01</text>
        <text class="tag" x="52" y="90">base64</text>
      </g>
      <g class="peel p2">
        <rect x="0" y="112" width="330" height="38" rx="6" fill="url(#layer)" stroke="#2a323c"/>
        <rect x="0" y="112" width="4" height="38" rx="2" fill="#ffb454" fill-opacity=".55"/>
        <text class="idx" x="18" y="136">02</text>
        <text class="tag" x="52" y="136">hex escapes</text>
      </g>
      <g class="peel p3">
        <rect x="0" y="158" width="330" height="38" rx="6" fill="url(#layer)" stroke="#2a323c"/>
        <rect x="0" y="158" width="4" height="38" rx="2" fill="#ffb454" fill-opacity=".55"/>
        <text class="idx" x="18" y="182">03</text>
        <text class="tag" x="52" y="182">eval wrapper</text>
      </g>
      <g class="peel p4">
        <rect x="0" y="204" width="330" height="38" rx="6" fill="url(#layer)" stroke="#2a323c"/>
        <rect x="0" y="204" width="4" height="38" rx="2" fill="#ffb454" fill-opacity=".55"/>
        <text class="idx" x="18" y="228">04</text>
        <text class="tag" x="52" y="228">packer</text>
      </g>

      <!-- what is left -->
      <g class="source">
        <rect x="0" y="250" width="330" height="38" rx="6" fill="#12161b" stroke="#ffb454" stroke-opacity=".45"/>
        <rect class="sourcebar" x="0" y="250" width="4" height="38" rx="2" fill="#ffb454"/>
        <text class="idx" x="18" y="274">05</text>
        <text class="tag" x="52" y="274" fill="#f4f6f8">source</text>
      </g>
    </g>
  </g>
</svg>
